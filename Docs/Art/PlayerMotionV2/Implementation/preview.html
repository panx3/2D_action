<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鉄球少女 / ゲーム用モーション</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#14141c;color:#efe5e9}body{margin:28px auto;max-width:1100px;padding:0 20px}h1{font-size:24px}p{line-height:1.8;color:#c9bfc9}a{color:#f0a1b9}button,select{font:inherit;border:1px solid #665263;border-radius:6px;background:#29232f;color:inherit;padding:8px 12px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.compare{display:flex;gap:18px;flex-wrap:wrap}figure{margin:0}figcaption{padding:8px 0;color:#c9bfc9}canvas{display:block;image-rendering:pixelated;background:#363340;background-image:linear-gradient(45deg,#3e3b48 25%,transparent 25%),linear-gradient(-45deg,#3e3b48 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3e3b48 75%),linear-gradient(-45deg,transparent 75%,#3e3b48 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}#idle,#motion{width:384px;height:384px;border:1px solid #665263;border-radius:8px}.frames{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.frames canvas{width:192px;height:192px;border:1px solid #665263}#status{min-height:2em;color:#f0a1b9}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}.shots img{width:100%;border-radius:6px}.small{font-size:13px}
</style>
<h1>鉄球少女 / ゲーム用モーション</h1>
<p>Idleと同じ原点で、実際に取り込んだSpriteを整数倍表示。上は2倍、下の連続コマは原寸です。再生はコマ確認用で、ゲーム中の状態遷移・物理を再現するものではありません。鉄球と鎖は別オブジェクトなのでSpriteには含みません。</p>
<nav><select id="select" aria-label="モーション"></select><button id="play">停止</button><button id="step">1コマ進む</button><button id="background">背景色</button></nav>
<div class="compare"><figure><canvas id="idle" width="192" height="192"></canvas><figcaption>基準Idle（既存画像そのまま）</figcaption></figure><figure><canvas id="motion" width="192" height="192"></canvas><figcaption id="status"></figcaption></figure></div>
<div id="frames" class="frames"></div>
<p class="small">チャージ走行・空中の追加差分、中央の一本の鎖を登る4コマも選択できます。接続点や実際の球の動きはゲーム内画像とPlay Modeで確認してください。</p>
<h2>ゲーム内表示</h2><div class="shots">
<figure><a href="Stage1-fall.png"><img src="Stage1-fall.png" alt="Stage1の実入力による降下" loading="lazy"></a><figcaption>Stage1 / 降下・髪と服の広がり</figcaption></figure>
<figure><a href="Stage2-charge.png"><img src="Stage2-charge.png" alt="Stage2の実行中チャージ" loading="lazy"></a><figcaption>Stage2 / 既存の鉄球を回すチャージ</figcaption></figure>
<figure><a href="Stage2-climb.png"><img src="Stage2-climb.png" alt="中央の鎖を握る登りの接続確認" loading="lazy"></a><figcaption>中央の鎖登り / 停止状態での接続確認資料</figcaption></figure>
</div><p><a href="README.md">実装・設定値・検証範囲</a></p>
<script>
const specs=[['引きずり走り','Run',0,6,6/.85],['上昇','Air',0,2,10,false],['頂点','Air',2,1,1,false],['降下','Air',3,2,1/.18,false],['着地','Air',5,3,30,false],['チャージ・静止','Charge',0,8,16],['チャージ・走行','ChargeRun',0,6,6/.85*.65],['チャージ・空中','ChargeAir',0,8,16],['回収','Utility',0,2,10,false],['地上・踏ん張り','Utility',2,2,10,false],['空中・引かれる','Utility',4,2,10,false],['ぶら下がり','Hanging',0,2,2.5],['中央の鎖登り','Climbing',0,4,5]];
for(const [label,sheet] of [['横','ThrowForward'],['斜め上','ThrowUpRight'],['上','ThrowUp'],['斜め下','ThrowDownRight'],['下','ThrowDown']]){specs.push([`地上発射・${label}`,sheet,0,3,16.6667,false],[`空中発射・${label}`,sheet,3,3,16.6667,false]);}
const select=document.getElementById('select'),motion=document.getElementById('motion'),idle=document.getElementById('idle'),status=document.getElementById('status'),frames=document.getElementById('frames'),images={};let playing=true,frame=0,start=performance.now(),generation=0;
for(let i=0;i<specs.length;i++){const option=document.createElement('option');option.value=i;option.textContent=specs[i][0];select.append(option);}
function load(name){if(!images[name]){const image=new Image;images[name]=new Promise((resolve,reject)=>{image.onload=()=>resolve(image);image.onerror=()=>reject(new Error(`画像を読み込めません: ${name}`));image.src=`../../../../Assets/Art/Player/MotionV2/${name}.png`;});}return images[name];}
function draw(canvas,image,index){const columns=image.width/192,ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,192,192);ctx.drawImage(image,(index%columns)*192,Math.floor(index/columns)*192,192,192,0,0,192,192);}
async function update(){const gen=++generation;frame=0;start=performance.now();frames.replaceChildren();try{const [label,name,offset,count]=specs[+select.value],image=await load(name);if(gen!==generation)return;for(let i=0;i<count;i++){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=canvas.height=192;draw(canvas,image,offset+i);caption.textContent=`${name}_${String(offset+i).padStart(2,'0')}`;figure.append(canvas,caption);frames.append(figure);}draw(motion,image,offset);status.textContent=`${label} / 1-${count}`;}catch(error){status.textContent=error.message;}}
function tick(now){const [label,name,offset,count,fps,loop=true]=specs[+select.value];if(playing){const next=Math.floor((now-start)/1000*fps);frame=loop?next%count:Math.min(count-1,next);}const loaded=images[name];if(loaded)loaded.then(image=>draw(motion,image,offset+frame));status.textContent=`${label} / ${frame+1} of ${count}`;requestAnimationFrame(tick);}
select.onchange=update;document.getElementById('play').onclick=function(){playing=!playing;const spec=specs[+select.value];if(playing&&spec[5]===false&&frame===spec[3]-1)frame=0;start=performance.now()-frame/spec[4]*1000;this.textContent=playing?'停止':'再生';};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='再生';frame=(frame+1)%specs[+select.value][3];};let light=false;document.getElementById('background').onclick=()=>{light=!light;for(const canvas of document.querySelectorAll('canvas')){canvas.style.backgroundColor=light?'#bfc7d2':'';canvas.style.backgroundImage=light?'none':'';}};
const idleImage=new Image;idleImage.onload=()=>{const ctx=idle.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(idleImage,0,0,128,128,32,32,128,128);};idleImage.src='../idle-reference.png';update();requestAnimationFrame(tick);
</script></html>
